<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/portal.css">
<meta name="robots" content="noindex"><title>Participant Portal | VSpark</title></head>
<body>
<main id="login" class="lg" hidden>
  <div class="card">
    <div class="brand"><svg viewBox="0 0 24 24"><path d="M3 4l7 16 3-7M21 4l-7 16"/></svg>VSPARK</div>
    <span class="chip">Participant Portal</span>
    <h1>Sign in</h1>
    <p class="sub">Use the email you registered with and your reference number (e.g. VS-PE-0001).</p>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username" placeholder="you@example.com">
    <label for="rf">Reference number</label><input id="rf" placeholder="VS-PE-0001" autocomplete="off">
    <p id="lerr" class="err" role="alert"></p>
    <button id="lb" class="primary">Sign in</button>
    <a class="back" href="/">&larr; Back to website</a>
  </div>
</main>
<div id="app" class="wrap" hidden>
  <div class="top"><a class="logo" href="/">VSPARK</a><nav><a href="/results">Results</a> <button id="lo" class="g">Sign out</button></nav></div>
  <div id="out"></div>
</div>
<script src="/js/portal.js" defer></script></body></html>
